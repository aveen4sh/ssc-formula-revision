<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Flashcards: SSC CGL and RRB NTPC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--bg:#f6f7f9;--ink:#16202c;--mute:#5b6775;--card:#fff;--line:#d5dbe3;--accent:#1f5fbf;--ok:#1c7a4b;--redo:#b4491f}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--ink:#e8edf3;--mute:#98a4b3;--card:#1a222d;--line:#2e3948;--accent:#6aa3f0;--ok:#4cc38a;--redo:#f0935f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.stat{color:var(--mute);margin:8px 0}
.scene{perspective:1000px}
.card{position:relative;width:100%;min-height:320px;color:var(--ink);cursor:pointer;transition:transform .45s;transform-style:preserve-3d;border:0;padding:0;background:none;text-align:inherit}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.topic{color:var(--mute);font-size:.85rem}
.fig:empty{display:none}
.fig svg{display:block;height:110px;width:auto;max-width:100%}
.fig svg.tall{height:150px}
.fig svg.tall text{font-size:20px}
.q{font-size:1.2rem;font-weight:600}
.formula{font-size:1.4rem;overflow-x:auto;max-width:100%}
.note{color:var(--mute);font-size:.9rem}
.hint{color:var(--mute);font-size:.85rem}
#wrap{display:flex;align-items:center;gap:8px}
#stage{flex:1;min-width:0}
.arrow:disabled{opacity:.3;cursor:default}
.arrow{flex:0 0 44px;width:44px;height:44px;padding:0;border-radius:50%;font-size:1.6rem;line-height:1}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Geometry formula flashcards</h1>
  <div class="bar">
    <select id="topic" aria-label="Topic"></select>
    <button id="shuffle">Shuffle</button>
  </div>
  <div class="stat" id="stat"></div>
  <div id="wrap">
    <button class="arrow" id="prev" aria-label="Previous card">&#8249;</button>
    <div id="stage"></div>
    <button class="arrow" id="next" aria-label="Next card">&#8250;</button>
  </div>
  <p class="hint">Tap the card to flip. Use the side arrows or the arrow keys to move.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
// Add new cards here. "front" is plain text, "back" is LaTeX (KaTeX), "note" is optional plain text.
const CARDS = [
  { id: "geo-tri-001", topic: "Triangles", front: "Sum of the interior angles of a triangle",
    back: "180^\\circ" },
  { id: "geo-tri-002", topic: "Triangles", front: "Condition for sides a, b, c to form a triangle",
    back: "|a-b| < c < a+b",
    note: "If a + b = c exactly, the points are collinear: no triangle." },
  { id: "geo-tri-003", topic: "Triangles", front: "Two sides are fixed integers. How many integer values can the third side take?",
    back: "2 \\times (\\text{smaller side}) - 1",
    note: "Example: sides 10 and 17 give 7 < x < 27, so 19 values." },
  { id: "geo-tri-004", topic: "Triangles", front: "Angles of a triangle are in A.P. What is the middle angle?",
    back: "60^\\circ",
    note: "Angles are 60° − d, 60°, 60° + d. The other two always sum to 120°." },
  { id: "geo-tri-005", topic: "Triangles", front: "Acute triangle test (c is the longest side)",
    back: "c^2 < a^2 + b^2",
    note: "Tip: reduce the sides to a simple ratio first, then square." },
  { id: "geo-tri-006", topic: "Triangles", front: "Right-angled triangle test (c is the longest side)",
    back: "c^2 = a^2 + b^2" },
  { id: "geo-tri-007", topic: "Triangles", front: "Obtuse triangle test (c is the longest side)",
    back: "c^2 > a^2 + b^2",
    note: "Example: 9 : 13 : 18 gives 324 > 81 + 169, so obtuse." },
  { id: "geo-tri-008", topic: "Triangles", front: "Internal bisectors of ∠B and ∠C meet at I. Find ∠BIC.",
    back: "\\angle BIC = 90^\\circ + \\dfrac{\\angle A}{2}" },
  { id: "geo-tri-009", topic: "Triangles", front: "External bisectors of ∠B and ∠C meet at O. Find ∠BOC.",
    back: "\\angle BOC = 90^\\circ - \\dfrac{\\angle A}{2}" },
  { id: "geo-tri-010", topic: "Triangles", front: "What is ∠BIC + ∠BOC, and what does it tell you?",
    back: "180^\\circ",
    note: "Opposite angles are supplementary, so B, I, C, O lie on one circle (BICO is cyclic)." },
  { id: "geo-tri-011", topic: "Triangles", front: "AD ⟂ BC and O is any point on AD. Relate AB, AC, OB, OC.",
    back: "AB^2 + OC^2 = OB^2 + AC^2",
    note: "Example: BO = 5, CO = 6, AC = 8 gives AB² = 53." }
];

// Simple sketches for the front of cards. Add a matching id here to give any card a figure.
const svg = (inner, vb = "0 -12 200 112") => `<svg class="${vb.includes('202') ? "tall" : ""}" viewBox="${vb}" role="img" aria-label="Sketch of a triangle" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${inner}</svg>`;
const t = (x, y, s, a = "middle") => `<text x="${x}" y="${y}" text-anchor="${a}" fill="currentColor" stroke="none" font-size="14" font-style="italic" font-family="Georgia,serif">${s}</text>`;
const base = '<path d="M90 5 L50 85 L150 85 Z"/>';
const verts = t(90, -2, "A") + t(44, 97, "B", "end") + t(156, 97, "C", "start");
const flat = "0 0 200 132", tall = "0 -12 200 202";
const FIGS = {
  "geo-tri-001": svg(base + verts),
  "geo-tri-002": svg(base + t(56, 50, "c", "end") + t(126, 50, "b", "start") + t(100, 100, "a")),
  "geo-tri-003": svg(base + t(56, 50, "a", "end") + t(126, 50, "b", "start") + t(100, 100, "x")),
  "geo-tri-004": svg(base + t(90, 35, "a") + t(62, 78, "a−d", "start") + t(138, 78, "a+d", "end")),
  "geo-tri-005": svg('<path d="M30 110 L170 110 L95 30 Z"/>' + t(54, 66, "a", "end") + t(138, 66, "b", "start") + t(100, 126, "c"), flat),
  "geo-tri-006": svg('<path d="M30 110 L170 110 L60 53 Z"/><path d="M56.3 60.1 L63.4 63.8 L67.1 56.7"/>' + t(38, 80, "a", "end") + t(122, 76, "b", "start") + t(100, 126, "c"), flat),
  "geo-tri-007": svg('<path d="M30 110 L170 110 L60 70 Z"/>' + t(38, 94, "a", "end") + t(124, 86, "b", "start") + t(100, 126, "c"), flat),
  "geo-tri-008": svg(base + '<path d="M50 85 L94.7 57.4 L150 85"/><path d="M82.8 64.8 A14 14 0 0 0 107.2 63.7"/>' + verts + t(101, 52, "I", "start")),
  "geo-tri-009": svg(base + '<path d="M50 85 L105.3 174.5 L150 85"/><path d="M97.9 162.6 A14 14 0 0 1 111.6 162"/>' + verts + t(112, 182, "O", "start"), tall),
  "geo-tri-010": svg(base + '<path d="M50 85 L94.7 57.4 L150 85 L105.3 174.5 Z"/><circle cx="100" cy="116" r="58.8" stroke-dasharray="4 4"/>' + verts + t(102, 50, "I", "start") + t(112, 182, "O", "start"), tall),
  "geo-tri-011": svg(base + '<path d="M90 5 L90 85" stroke-dasharray="4 4"/><path d="M50 85 L90 45 L150 85"/><path d="M90 77 L98 77 L98 85"/>' + verts + t(90, 100, "D") + t(97, 44, "O", "start"))
};
CARDS.forEach(c => { c.fig = FIGS[c.id]; });

const $ = id => document.getElementById(id);
let deck = [], i = 0, flipped = false;

const topics = ["All", ...new Set(CARDS.map(c => c.topic))];
$("topic").innerHTML = topics.map(t => `<option>${t}</option>`).join("");

function build(shuffle) {
  const t = $("topic").value;
  deck = CARDS.filter(c => t === "All" || c.topic === t);
  if (shuffle) deck.sort(() => Math.random() - 0.5);
  i = 0; flipped = false; render();
}

function render() {
  $("stat").textContent = deck.length ? `Card ${i + 1} of ${deck.length}` : "";
  const stage = $("stage");
  $("prev").disabled = i === 0;
  $("next").disabled = i >= deck.length - 1;
  if (!deck.length) { stage.innerHTML = '<div class="empty">No cards for this topic yet.</div>'; return; }
  const c = deck[i];
  stage.innerHTML = `<div class="scene"><button class="card${flipped ? " flip" : ""}" id="card" aria-label="Flip card">
    <div class="face front"><div class="topic"></div><div class="fig"></div><div class="q"></div></div>
    <div class="face back"><div class="formula"></div><div class="note"></div></div></button></div>`;
  stage.querySelector(".topic").textContent = c.topic;
  stage.querySelector(".fig").innerHTML = c.fig || "";
  stage.querySelector(".q").textContent = c.front;
  stage.querySelector(".note").textContent = c.note || "";
  const f = stage.querySelector(".formula");
  try { katex.render(c.back, f, { throwOnError: false, displayMode: true }); } catch (e) { f.textContent = c.back; }
  $("card").onclick = flip;
}

function flip() { flipped = !flipped; $("card").classList.toggle("flip", flipped); }
function go(d) { const n = i + d; if (n < 0 || n >= deck.length) return; i = n; flipped = false; render(); }

$("topic").onchange = () => build(false);
$("shuffle").onclick = () => build(true);
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
document.addEventListener("keydown", e => {
  if (document.activeElement.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " && document.activeElement.id !== "card") { e.preventDefault(); if (deck.length) flip(); }
});

window.addEventListener("load", () => build(false));
</script>
</body>
</html>
